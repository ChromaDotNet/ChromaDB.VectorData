name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Build
        run: dotnet build ChromaDB.VectorData.slnx

  unit-tests:
    name: 'Unit Tests (${{ matrix.os }})'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Test
        run: dotnet test test/ChromaDB.VectorData.UnitTests

  # Conformance tests run on Ubuntu only: they start Chroma with Testcontainers and a Linux Docker image,
  # which isn't available on Windows GitHub-hosted runners.
  conformance-tests:
    name: 'Conformance Tests (Chroma ${{ matrix.chroma }})'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.5.0, the first release that stores lists in metadata; 1.5.9, the current release;
        # latest catches new releases without blocking.
        chroma: ['1.5.0', '1.5.9', 'latest']
    continue-on-error: ${{ matrix.chroma == 'latest' }}
    env:
      CHROMA_IMAGE: chromadb/chroma:${{ matrix.chroma }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Test
        run: dotnet test test/ChromaDB.VectorData.ConformanceTests

  # The dynamic collection is the way to use the provider with NativeAOT: a trimming or NativeAOT warning fails the publish,
  # and the native program checks the provider against Chroma.
  native-aot:
    name: NativeAOT
    needs: build
    runs-on: ubuntu-latest
    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Install the NativeAOT prerequisites
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: dotnet publish test/NativeAot -c Release -o native-aot

      - name: Wait for Chroma
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v2/heartbeat && exit 0
            sleep 2
          done
          exit 1

      - name: Run
        run: ./native-aot/ChromaDB.VectorData.NativeAot

  # Every run packs the provider; only a version tag publishes it, with the version set in the project file.
  package:
    name: Package
    needs: [unit-tests, conformance-tests, native-aot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dotnet pack src/ChromaDB.VectorData -c Release -o nuget -p:CI=true
            version="${GITHUB_REF_NAME#v}"
            if [[ ! -f "nuget/ChromaDotNet.VectorData.$version.nupkg" ]]; then
              echo "The tag $GITHUB_REF_NAME does not match the version in the project file:" >&2
              ls nuget >&2
              exit 1
            fi
          else
            dotnet pack src/ChromaDB.VectorData -c Release -o nuget -p:CI=true --version-suffix "ci.$GITHUB_RUN_NUMBER"
          fi

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          if-no-files-found: error
          path: nuget/*.nupkg

  # NuGet trusted publishing: the NUGET_USER variable names the nuget.org account with a trusted publishing policy
  # for this repository, this workflow and the nuget environment.
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: './*.nupkg'

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./*.nupkg
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
