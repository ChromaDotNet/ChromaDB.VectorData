name: Release assets

# Attaches to each GitHub release the package published on nuget.org and its Sigstore signature.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, like v0.4.0
        required: true

permissions:
  contents: read

jobs:
  assets:
    name: Package and signature
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the package from nuget.org
        run: |
          version="${TAG#v}"
          id=ChromaDotNet.VectorData
          lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
          mkdir packages
          file="packages/$id.$version.nupkg"
          # nuget.org can take a few minutes to serve a new package.
          for attempt in $(seq 1 60); do
            curl -fsSL -o "$file" "https://api.nuget.org/v3-flatcontainer/$lower/$version/$lower.$version.nupkg" && break
            sleep 30
          done
          test -s "$file"

      - name: Sign
        run: |
          for file in packages/*.nupkg; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Upload to the release
        run: gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
